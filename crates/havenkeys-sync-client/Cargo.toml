[package]
name = "havenkeys-sync-client"
version = "0.25.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published: these are workspace crates with path dependencies.
publish = false

[features]
# Mobile: verify the server with the operating system's trust store (spec
# 2026-10-01-android-app §6.3) instead of the bundled Mozilla roots, so a
# self-hosted server with a CA the user installed works as it does in the
# phone's browser.
platform-verifier = ["dep:rustls", "dep:rustls-platform-verifier"]

[dependencies]
havenkeys-core = { path = "../havenkeys-core" }
# rustls, never OpenSSL; no cookie store, no proxy auto-detection, nothing
# that could take the bearer token somewhere the user did not choose.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
data-encoding = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
url = "2"
# Drops bidi and zero-width characters from what a pairing confirmation
# shows (PA4); the server is not trusted to have done it.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }

[dev-dependencies]
# test-util exposes StagedWrite::for_test, used only by this crate's tests to
# put malformed data on a test server; never enabled by the normal dependency
# above, so the desktop build never gets it.
havenkeys-core = { path = "../havenkeys-core", features = ["test-util"] }
havenkeys-server = { path = "../havenkeys-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
deadpool-postgres = "0.14"
