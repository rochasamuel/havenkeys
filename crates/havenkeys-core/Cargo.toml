[package]
name = "havenkeys-core"
version = "0.4.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Security core for the HavenKeys password manager"
publish = false

[dependencies]
# --- cryptography (RustCrypto) ---
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha1 = "0.11"
sha2 = "0.11"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng", "unbiased"] }
zeroize = "1.9"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
# --- encoding / parsing ---
data-encoding = "2.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
uuid = { version = "1.20", features = ["v4", "serde"] }
# --- storage / errors ---
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
unicode-normalization = "0.1.25"
percent-encoding = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
psl = "2"

[dev-dependencies]
tempfile = "3"
ciborium = "0.2"

[features]
# Exposes test-only constructors (e.g. StagedWrite::for_test) to other
# workspace crates' test code. Never enabled by a release/normal dependency.
test-util = []
