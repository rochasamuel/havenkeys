[package]
name = "havenkeys-bridge"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop side of the HavenKeys browser integration: socket server and request authorization"
publish = false

[dependencies]
havenkeys-core = { path = "../havenkeys-core" }
havenkeys-protocol = { path = "../havenkeys-protocol" }
interprocess = "2.4"
uuid = "1.20"
zeroize = "1.9"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
uuid = { version = "1.20", features = ["v4"] }
