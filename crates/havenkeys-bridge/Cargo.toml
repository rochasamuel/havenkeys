[package]
name = "havenkeys-bridge"
version = "0.23.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop side of the HavenKeys browser integration: socket server and request authorization"
publish = false

[dependencies]
havenkeys-core = { path = "../havenkeys-core" }
havenkeys-protocol = { path = "../havenkeys-protocol" }
interprocess = "2.4"
# Measures a find_matches answer before it is framed (already in the tree via havenkeys-protocol).
serde_json = "1"
uuid = "1.20"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1.20", features = ["v4"] }
