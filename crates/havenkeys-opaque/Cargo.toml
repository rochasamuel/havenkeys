[package]
name = "havenkeys-opaque"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The one OPAQUE (RFC 9807) suite HavenKeys uses, as byte-level calls."

[dependencies]
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
