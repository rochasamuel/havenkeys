[package]
name = "havenkeys-protocol"
version = "0.4.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wire protocol shared by the HavenKeys desktop bridge and native messaging host"
publish = false

# Deliberately does not depend on havenkeys-core: the native host links this
# crate and must never contain vault or crypto code.
[dependencies]
interprocess = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.20", features = ["serde"] }
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
# Safe wrapper for geteuid(); already in the dependency tree via tempfile.
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.11"
# Same version interprocess uses; needed to pass it an SDDL string.
widestring = "1"
