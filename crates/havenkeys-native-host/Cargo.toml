[package]
name = "havenkeys-native-host"
version = "0.4.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native messaging host that relays the HavenKeys browser extension to the desktop app"
publish = false

# No vault, no crypto: this binary only validates and relays messages.
[dependencies]
havenkeys-protocol = { path = "../havenkeys-protocol" }
interprocess = "2.4"
serde_json = "1"
zeroize = "1.9"

# Only to write this user's NativeMessagingHosts registry keys (register.rs);
# already in the tree through the desktop's dependencies.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
havenkeys-bridge = { path = "../havenkeys-bridge" }
havenkeys-core = { path = "../havenkeys-core" }
tempfile = "3"
uuid = "1.20"
