# cargo-deny policy. Run: cargo deny check

[graph]
all-features = false

[advisories]
# Vulnerabilities always fail. The ignores below are unmaintained/unsound
# warnings that come only through Tauri's Linux GTK stack, not through
# havenkeys-core; each is reviewed in docs/security-review.md.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time only, via gtk-rs 0.18 macros" },
  { id = "RUSTSEC-2025-0075", reason = "unic-*: via tauri-utils/urlpattern, no untrusted input" },
  { id = "RUSTSEC-2025-0080", reason = "unic-*: via tauri-utils/urlpattern, no untrusted input" },
  { id = "RUSTSEC-2025-0081", reason = "unic-*: via tauri-utils/urlpattern, no untrusted input" },
  { id = "RUSTSEC-2025-0098", reason = "unic-*: via tauri-utils/urlpattern, no untrusted input" },
  { id = "RUSTSEC-2025-0100", reason = "unic-*: via tauri-utils/urlpattern, no untrusted input" },
  { id = "RUSTSEC-2024-0429", reason = "glib VariantStrIter: API not used by HavenKeys; upstream gtk-rs 0.18" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
crate = "havenkeys-core"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
