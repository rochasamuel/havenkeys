name: field-words
# The extension's and Android's keyword constants are generated from
# packages/field-words/words.json and committed; this fails when a copy is
# stale (spec 2026-10-19-shared-field-words-design §3.2). No dependencies.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Generator tests
        run: node --test
        working-directory: packages/field-words
      - name: Generated copies are current
        run: node packages/field-words/generate.mjs --check
