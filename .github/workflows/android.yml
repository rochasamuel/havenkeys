name: android
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  # Same NDK as apps/android/app/build.gradle.kts (ndkVersion).
  ANDROID_NDK_VERSION: 30.0.16248370
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: cargo test -p havenkeys-mobile --features testing
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" scripts/build-android.sh
      - name: Generated bindings are committed and current
        run: |
          git status --porcelain --untracked-files=all apps/android/app/src/main/kotlin/uniffi
          test -z "$(git status --porcelain --untracked-files=all apps/android/app/src/main/kotlin/uniffi)"
      - working-directory: apps/android
        run: ./gradlew detekt testGithubDebugUnitTest lintGithubDebug assembleGithubDebug
