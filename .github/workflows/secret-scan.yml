name: secret-scan
# Every push and pull request is scanned for committed secrets (security
# review SC3). Read-only token; gitleaks is a pinned release whose archive
# is checked against its published SHA-256 before it runs.
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # Findings are redacted in the log; .gitleaksignore lists reviewed
      # false positives.
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
