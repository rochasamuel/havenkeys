name: release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

# Installers are unsigned; see docs/website.md ("Known limitation").
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the tag matches the app version
        shell: bash
        run: |
          app_version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          test "${GITHUB_REF_NAME#desktop-v}" = "$app_version" || { echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app_version"; exit 1; }

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Shipped next to the app, which registers it with the user's browsers
      # at start (apps/desktop/src-tauri/src/native_host.rs).
      - name: Build the native host sidecar
        run: node scripts/build-native-host-sidecar.mjs --target ${{ matrix.target }}

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "HavenKeys ${{ github.ref_name }}"
          releaseBody: "Installers for this release. Unsigned: Windows SmartScreen and macOS Gatekeeper will warn on first run."
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }}
