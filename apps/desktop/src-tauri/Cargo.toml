[package]
name = "havenkeys-desktop"
version = "0.4.1"
description = "HavenKeys desktop password manager"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "havenkeys_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
havenkeys-core = { path = "../../../crates/havenkeys-core" }
havenkeys-bridge = { path = "../../../crates/havenkeys-bridge" }
# Only its `register` module: the relay itself runs as the separate sidecar.
havenkeys-native-host = { path = "../../../crates/havenkeys-native-host" }
havenkeys-oslock = { path = "../../../crates/havenkeys-oslock" }
havenkeys-protocol = { path = "../../../crates/havenkeys-protocol" }
havenkeys-sync-client = { path = "../../../crates/havenkeys-sync-client" }
# No fs, shell, http, opener or clipboard plugin. The plugins below are driven
# from Rust only; the capability grants the renderer none of their commands.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# Only for a timer (the unlock fallback); already in the tree through Tauri.
tokio = { version = "1", features = ["time"] }
serde_json = "1"
uuid = { version = "1.20", features = ["serde"] }
# Clipboard is handled in Rust so copied secrets never transit the renderer.
arboard = { version = "3.6", default-features = false }
sha2 = "0.11"
zeroize = "1.8"
tauri-plugin-dialog = "2"
qrcode = { version = "0.14", default-features = false }
# The Secret Key lives in the OS keychain (secret_store.rs). keyring-core plus
# only this platform's native store: no mock, file or keyutils backends.
keyring-core = "1.0"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Blocking API only (calls run on their own thread in secret_store.rs), with
# the pure-Rust crypto for the encrypted Secret Service session.
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"
