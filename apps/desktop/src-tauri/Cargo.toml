[package]
name = "havenkeys-desktop"
version = "0.36.0"
description = "HavenKeys desktop password manager"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "havenkeys_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
havenkeys-core = { path = "../../../crates/havenkeys-core" }
havenkeys-bridge = { path = "../../../crates/havenkeys-bridge" }
# Only its `register` module: the relay itself runs as the separate sidecar.
havenkeys-native-host = { path = "../../../crates/havenkeys-native-host" }
havenkeys-oslock = { path = "../../../crates/havenkeys-oslock" }
havenkeys-protocol = { path = "../../../crates/havenkeys-protocol" }
havenkeys-sync-client = { path = "../../../crates/havenkeys-sync-client" }
havenkeys-client = { path = "../../../crates/havenkeys-client" }
# No fs, shell, http or clipboard plugin. The plugins below are driven from
# Rust only; the capability grants the renderer none of their commands.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# A timer (the unlock fallback) and the change-password probe's DNS lookup
# (change_password.rs); already in the tree through Tauri.
tokio = { version = "1", features = ["time", "net"] }
# The change-password probe (change_password.rs), and nothing else: the same
# version and features as havenkeys-sync-client (rustls, no cookie store), so
# no new crate. Built with no proxy and a resolver that keeps public addresses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
url = "2"
serde_json = "1"
uuid = { version = "1.20", features = ["serde", "v4"] }
# Clipboard is handled in Rust so copied secrets never transit the renderer.
# `image-data` lets the QR scan read a screenshot from the clipboard.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
sha2 = "0.11"
# The computer's name for the account's device list (device_label.rs);
# already in Cargo.lock through x11rb.
gethostname = "1"
zeroize = "1.8"
tauri-plugin-dialog = "2"
qrcode = { version = "0.14", default-features = false }
# TOTP QR scan (qr_scan.rs): screen capture and a pure-Rust QR decoder. On
# Linux xcap links the system libpipewire-0.3. rxing without its `image`
# feature (which pins an exact `image` version); it does not build without
# `encoding_rs`.
xcap = "0.9"
rxing = { version = "0.8", default-features = false, features = ["encoding_rs"] }
# The Secret Key lives in the OS keychain (secret_store.rs). keyring-core plus
# only this platform's native store: no mock, file or keyutils backends.
keyring-core = "1.0"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Only its free `open_url` function (commands::open_website); the plugin is
# never registered, so the renderer has no opener commands at all.
tauri-plugin-opener = "2"
# In-app updates (updater.rs), driven from Rust only: the capability grants
# the renderer none of the plugin's commands. Verifies each download against
# the minisign public key in tauri.conf.json before it can be installed.
tauri-plugin-updater = "2"
# The Quick Access shortcut (quick_shortcut.rs), registered and unregistered
# from Rust only: no capability grants the renderer any of its commands.
tauri-plugin-global-shortcut = "2.4"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
# The quick window's system-drawn corners (quick_window.rs). Already in the
# tree through Tauri.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Blocking API only (calls run on their own thread in secret_store.rs), with
# the pure-Rust crypto for the encrypted Secret Service session.
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[dev-dependencies]
# The change-password probe's tests run it against a local server.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
havenkeys-client = { path = "../../../crates/havenkeys-client", features = ["testing"] }
tempfile = "3"
