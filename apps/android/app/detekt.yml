style:
  MagicNumber:
    # The theme is token values from packages/ui/src/tokens.css by design, and
    # the kit's geometry is design tokens too (apps/android/DESIGN.md).
    excludes: ['**/test/**', '**/testDebug/**', '**/androidTest/**', '**/ui/theme/**', '**/ui/kit/**', '**/catalogue/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Never log in HavenKeys (CLAUDE.md §40).'
        value: 'android.util.Log.v'
      - value: 'android.util.Log.d'
      - value: 'android.util.Log.i'
      - value: 'android.util.Log.w'
      - value: 'android.util.Log.e'
      - value: 'android.util.Log.wtf'
      - value: 'android.util.Log.println'
      - value: 'kotlin.io.println'
      - value: 'kotlin.io.print'
      - value: 'java.lang.Throwable.printStackTrace'
  ForbiddenImport:
    active: true
    imports:
      - value: 'android.util.Log'
        reason: 'Never log in HavenKeys (CLAUDE.md §40).'
complexity:
  LongParameterList:
    # Composables take a defaulted Modifier and options by convention.
    ignoreDefaultParameters: true
  TooManyFunctions:
    # Repositories mirror the Rust API one call per function.
    thresholdInInterfaces: 20
    ignoreOverridden: true
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
