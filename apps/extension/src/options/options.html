<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HavenKeys</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
    <script src="options.js" defer></script>
  </head>
  <body>
    <main>
      <header class="page-head">
        <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true"><path class="mark-shield" d="M512 196 L772 300 V500 C772 668 662 792 512 846 C362 792 252 668 252 500 V300 Z" /><circle class="mark-key" cx="512" cy="468" r="84" /><rect class="mark-key" x="486" y="520" width="52" height="170" rx="18" /></svg>
        <div>
          <h1>HavenKeys</h1>
          <p id="subtitle"></p>
        </div>
      </header>

      <h2 id="suggestions-title" class="group-title"></h2>
      <section class="group">
        <div class="row">
          <div class="row-main">
            <strong id="toggle-label"></strong>
            <p id="status" class="status" aria-live="polite"></p>
          </div>
          <button id="toggle" class="btn" type="button" hidden></button>
        </div>
      </section>
      <div id="notes"></div>

      <h2 id="access-title" class="group-title"></h2>
      <section class="group">
        <div class="row">
          <div class="row-main">
            <strong id="access-label"></strong>
            <p id="access-status" class="status" aria-live="polite"></p>
          </div>
          <button id="allow" class="btn primary" type="button" hidden></button>
        </div>
      </section>
      <p id="access-note" class="note"></p>

      <h2 id="without-title" class="group-title"></h2>
      <section class="group">
        <p id="without" class="group-text"></p>
      </section>
    </main>
  </body>
</html>
